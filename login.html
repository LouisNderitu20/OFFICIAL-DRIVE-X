<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drive X - Login</title>
  <link rel="icon" type="image/png" href="cropped_circle_image.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      display: flex;
      background: white;
      max-width: 800px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      width: 100%;
    }

    .login-info {
      background: #111;
      color: white;
      padding: 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .login-info img {
      width: 100px;
      margin-bottom: 20px;
    }

    .login-info h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .login-info p {
      font-size: 14px;
      opacity: 0.8;
    }

    .login-form {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-form h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #333;
    }

    .login-form input {
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      width: 100%;
    }

    .login-form button {
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .login-form button:hover {
      background-color: #0056b3;
    }

    .login-form .signup-link {
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
    }

    .login-form .signup-link a {
      color: #007bff;
      text-decoration: none;
    }

    .login-form .signup-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-info">
      <img src="cropped_circle_image.png" alt="DriveX Logo" />
      <h1>Welcome Back to Drive X</h1>
      <p>Log in to continue exploring premium cars and services.</p>
    </div>
    <div class="login-form">
      <h2>Login</h2>
      <form id="signup-form">
        <input type="text" name="name" placeholder="Full Name" required />
         <input type="email" name="email" placeholder="Email Address" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
        </form>

      <div class="signup-link">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>
  <script>
  document.getElementById('signup-form').addEventListener('submit', function(e) {
    e.preventDefault(); // prevent actual form submission

    // You can do validations or show messages here
    alert('Account created successfully! Redirecting to login page...');

    // Simulate delay and redirect to login
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1500);
  });
</script>

</body>
</html>
