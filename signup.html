<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drive X - Sign Up</title>
  <link rel="icon" type="image/png" href="cropped_circle_image.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }

    .signup-container {
      display: flex;
      background: white;
      max-width: 900px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      width: 100%;
    }

    .signup-info {
      background: #111;
      color: white;
      padding: 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .signup-info img {
      width: 100px;
      margin-bottom: 20px;
    }

    .signup-info h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .signup-info p {
      font-size: 14px;
      opacity: 0.8;
    }

    .signup-form {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .signup-form h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #333;
    }

    .signup-form input {
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      width: 100%;
    }

    .signup-form button {
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .signup-form button:hover {
      background-color: #0056b3;
    }

    @media (max-width: 768px) {
      .signup-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="signup-info">
      <img src="cropped_circle_image.png" alt="DriveX Logo" />
      <h1>Welcome to Drive X</h1>
      <p>Your journey begins here. Join us for premium cars, services, and more.</p>
    </div>
    <div class="signup-form">
      <h2>Create Your Account</h2>
      <form>
        <input type="text" name="name" placeholder="Full Name" required />
        <input type="email" name="email" placeholder="Email Address" required />
        <input type="tel" name="phone" placeholder="Phone Number" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
      </form>
    </div>
  </div>
</body>
</html>
